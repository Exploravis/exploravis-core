apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: banner-worker
  namespace: exploravis
spec:
  selector:
    matchLabels:
      app: banner-worker
  template:
    metadata:
      labels:
        app: banner-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: banner-worker
          image: ghcr.io/exploravis/banner-worker:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            capabilities:
              add: ["NET_RAW", "NET_ADMIN"]
          hostNetwork: true
