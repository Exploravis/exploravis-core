apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exploravis-ui
  namespace: exploravis
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: ui.dev-exploravis.mywire.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exploravis-ui
                port:
                  number: 3000
  tls:
    - hosts:
        - ui.dev-exploravis.mywire.org
      secretName: exploravis-ui-tls
